spring.application.name=Product Order Service
server.port=8080
spring.profiles.active=docker
spring.main.banner-mode=console
spring.jackson.serialization.indent-output=true
spring.output.ansi.enabled=ALWAYS

#database
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=postgres
spring.datasource.password=password

# Hikari connection pool
spring.datasource.hikari.pool-name=ProductOrderServicePool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

#flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-before-migrate=true

#security


security.jwt.issuer=product-order-service
security.jwt.secret=925a535ae6b637e918d9c1189befb2d6
security.jwt.expiration-ms=86400000
spring.main.allow-circular-references=true


#cache
spring.cache.type=simple

#localstack
aws.endpoint=http://localhost:4566
aws.region=ap-south-1
aws.accessKeyId=test
aws.secretAccessKey=test
s3.bucket.invoices=invoices

#invoice
invoice.prefix=INV-
invoice.date-format=yyyy-MM-dd
invoice.temp-dir=/tmp/invoices

#Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.server.port=8082

#logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/product-order-service.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=product-order-consumers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
